<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PyMatch is an educational library for neural networks." />
  <title>PyMatch</title>
</head>

<body>
  <header>
    <h1>Welcome to PyMatch</h1>
  </header>

  <main>
    <p>PyMatch is an educational library for neural networks.</p>
    <div id="app">
      <label for="code-input"><strong>Type a Python expression:</strong></label>
      <textarea id="code-input" rows="4" placeholder="Type a Python expression e.g. 4 + 2">4 + 2</textarea>
      <button id="run-btn">Run Expression</button>
      
      <div id="output-container">
        <h3>Output:</h3>
        <pre id="output-text">Loading Pyodide...</pre>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Anthony J. Clark. All rights reserved.</p>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
