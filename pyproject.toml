[project]
name = "match"
version = "0.1.0"
description = "A pure-Python, PyTorch-like automatic differentiation library for education."
readme = "README.md"
authors = [ { name = "Anthony Clark & PyMatch Team" } ]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

keywords = [
    "deep-learning",
    "autograd",
    "pytorch",
    "neural-network",
    "educational",
    "webgpu",
    "webassembly"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = []

[project.scripts]
match-test = "tests.run_tests:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "torch>=2.0.0"
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Failed to initialize NumPy:UserWarning"
]

[project.urls]
Homepage = "https://github.com/anthonyjclark/pymatch"
Repository = "https://github.com/anthonyjclark/pymatch"
Issues = "https://github.com/anthonyjclark/pymatch/issues"

[tool.setuptools.packages.find]
include = ["match*", "tests*"]

[tool.setuptools.package-data]
match = ["*.c", "*.cu"]

[tool.ruff]
line-length = 110
